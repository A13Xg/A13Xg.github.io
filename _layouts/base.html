<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <title>{{ page.head_title | default: page.title | escape }}</title>
  {%- if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {%- endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  {%- include section.html -%}
  {%- if section_home.accent %}
  <style>
    :root { --accent: {{ section_home.accent }}; }
    @media (prefers-color-scheme: dark) { :root { --accent: {{ section_home.accent_dark | default: section_home.accent }}; } }
  </style>
  {%- endif %}
  {%- if section_home.icon %}
  <link rel="icon" href="{{ section_home.icon }}">
  <link rel="apple-touch-icon" href="{{ section_home.icon }}">
  {%- endif %}
</head>
<body class="layout-{{ page.layout }}">
  <header class="site-header">
    <div class="wrap header-inner">
      {%- include header.html -%}
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ site.time | date: "%Y" }} A13Xg Industries</span>
      <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>
    </div>
  </footer>
</body>
</html>
