<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.head_title | default: page.title | escape }}</title>
  {%- if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {%- endif %}
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      {%- include header.html -%}
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">© {{ site.time | date: "%Y" }} A13Xg Industries · <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></div>
  </footer>
</body>
</html>
