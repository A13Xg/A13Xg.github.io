---
layout: base
---
<h1>{{ page.title }}</h1>
{{ content }}
{%- assign sections = site.pages | where: "layout", "app" | sort: "title" %}
<ul class="cards">
  {%- for s in sections %}
  <li><a href="{{ s.url }}"><strong>{{ s.title }}</strong>{% if s.description %}<span>{{ s.description }}</span>{% endif %}</a></li>
  {%- endfor %}
</ul>
